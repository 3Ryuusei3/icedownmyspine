<!doctype html>
<html lang="es" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hielo espalda" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#11161f" />
    <script>
      // Aplica la paleta guardada (o Medianoche) antes del primer pintado.
      try {
        document.documentElement.classList.add(
          localStorage.getItem("ice-palette") || "noche",
        );
      } catch (e) {
        document.documentElement.classList.add("noche");
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hielo por la espalda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
